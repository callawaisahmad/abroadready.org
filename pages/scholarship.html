</footer>

<script src="../js/scholarships-data.js"></script>
<script src="../js/scholarships.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var SB = window.SB;
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var s = id ? SB.byId(id) : (SB.all[0] || null);

  if (!s) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  document.title = s.name + ' | AbroadReady';

  var d = SB.deadlineInfo(s);
  var sm = SB.statusMeta(d.status);
  var esc = SB.esc;

  function list(items, cls) {
    if (!items || !items.length) return '<p class="muted">Details vary — see the official website.</p>';
    return '<ul class="' + (cls || 'req-list') + '">' + items.map(function (i) {
      return '<li>' + esc(i) + '</li>';
    }).join('') + '</ul>';
  }

  function factRow(label, value) {
    if (!value) return '';
    return '<div class="fact-row"><span class="fact-label">' + esc(label) + '</span><span class="fact-value">' + esc(value) + '</span></div>';
  }

  var deadlineStat = d.status === 'closed' || d.status === 'upcoming'
    ? '<span class="stat-val" style="color:#6b7280;">' + esc(d.label) + '</span>'
    : d.hasDate
      ? '<span class="stat-val ' + (d.status === 'closing' ? 'text-red' : '') + '">' + esc(d.label) + '</span>'
      : '<span class="stat-val">' + esc(s.deadlineNote || 'Varies') + '</span>';

  var feeStat = s.isFree
    ? '<span class="stat-val" style="color:#047857;">Free</span>'
    : '<span class="stat-val">' + esc(s.applicationFee) + '</span>';

  // Before-you-apply interactive checklist
  var beforeItems = (s.thingsToHaveBeforeApply && s.thingsToHaveBeforeApply.length)
    ? s.thingsToHaveBeforeApply
    : ['Academic transcripts', 'Valid passport', 'A strong CV / résumé'];
  var beforeHtml = beforeItems.map(function (i, idx) {
    return '<li><label><input type="checkbox" data-ready><span>' + esc(i) + '</span></label></li>';
  }).join('');

  var fieldsChips = (s.fields || []).map(function (f) {
    return '<span class="pill">' + esc(f) + '</span>';
  }).join('');
  var levelChips = (s.levels || []).map(function (l) {
    return '<span class="pill pill-blue">' + esc(l) + '</span>';
  }).join('');

  var daysBanner = d.status === 'closed' && d.opens && d.closes
    ? '<div class="deadline-banner" style="background:rgba(107,114,128,0.1);border-color:#d1d5db;">🔒 Closed · Next window: ' + esc(SB.monthNames[d.opens.getMonth()]) + ' → ' + esc(SB.monthNames[d.closes.getMonth()]) + ' ' + d.closes.getFullYear() + '</div>'
    : d.status === 'closed'
    ? '<div class="deadline-banner" style="background:rgba(107,114,128,0.1);border-color:#d1d5db;">🔒 Applications are currently closed. ' + esc(d.label || '') + '</div>'
    : d.status === 'upcoming'
      ? '<div class="deadline-banner" style="background:rgba(245,158,11,0.1);border-color:#f59e0b;">📅 Applications open ' + esc((d.opens ? SB.monthNames[d.opens.getMonth()] + ' ' + d.opens.getFullYear() : d.label || '')) + '</div>'
      : d.hasDate
        ? d.opens && d.closes
          ? '<div class="deadline-banner ' + (d.status === 'closing' ? 'urgent' : '') + '">📅 <strong>' + esc(SB.monthNames[d.opens.getMonth()]) + ' → ' + esc(SB.monthNames[d.closes.getMonth()]) + ' ' + d.closes.getFullYear() + '</strong> · ⏳ ' + d.daysLeft + ' days left</div>'
          : '<div class="deadline-banner ' + (d.status === 'closing' ? 'urgent' : '') + '">⏳ <strong>' + d.daysLeft + ' days</strong> until the approximate ' + esc(SB.monthNames[s.deadlineMonthNum - 1]) + ' deadline</div>'
        : '<div class="deadline-banner rolling">🔄 Rolling / varies — confirm exact dates on the official site</div>';

  /* ---- Dynamic content generation ----------------------------------- */
  function extractEligibility(regex) {
    var found = [];
    (s.eligibility || []).forEach(function (e) { if (regex.test(e)) found.push(e); });
    return found;
  }
  var engItems = extractEligibility(/ielts|toefl|pte|duolingo|english|language|cambridge/i);
  var gpaItems = extractEligibility(/gpa|cgpa|grade|degree|class|honours|honor|2:1|first.class|upper.second|merit|distinction|gmat|gre/i);
  var ageItems = extractEligibility(/age|under \d|year.*old/i);
  var expItems = extractEligibility(/experience|work|employed|professional/i);
  var isPhD = (s.levels || []).some(function (l) { return /phd|doctoral|doctor/i.test(l); });
  var isMasters = (s.levels || []).some(function (l) { return /master/i.test(l); });
  var isUG = (s.levels || []).some(function (l) { return /bachelor|undergrad/i.test(l); });

  /* ---- Dynamic "How to Apply" section -------------------------------- */
  var howToApplyHtml = '<div class="info-section card">' +
    '<h2>📋 How to Apply — Step by Step</h2>' +
    '<ol class="req-list how-to-apply-list">' +
      '<li><strong>Check eligibility:</strong> Review the criteria above — ' + (s.eligibility && s.eligibility.length ? esc(s.eligibility[0]) + '.' : 'ensure you meet all requirements.') + ' Every year applicants are rejected for missing basic criteria.</li>' +
      '<li><strong>Gather documents:</strong> Prepare all required documents listed above. ' + (s.documentsRequired && s.documentsRequired.length > 2 ? 'At minimum you need ' + esc(s.documentsRequired[0]) + ', ' + esc(s.documentsRequired[1]) + ', and ' + esc(s.documentsRequired[2]) + '.' : 'Start early — some documents take weeks to obtain.') + ' Attestation and notarisation may be needed depending on your country.</li>' +
      '<li><strong>Apply on the official portal:</strong> <a href="' + esc(s.applyLink) + '" target="_blank" rel="noopener">Open official application portal ↗</a>. ' + (s.isFree ? 'This scholarship is free to apply — there is no application fee.' : 'Note the application fee of ' + esc(s.applicationFee) + '.') + '</li>' +
      '<li><strong>Submit before the deadline:</strong> ' + (d.hasDate ? 'The deadline is approximately <strong>' + esc(SB.monthNames[s.deadlineMonthNum - 1]) + '</strong>. Submit at least a few days before the final date to avoid last-minute technical issues.' : 'Check the official website for the exact deadline — this scholarship has ' + esc(s.deadlineNote || 'a rolling or variable deadline') + '.') + '</li>' +
      '<li><strong>Track your application:</strong> After submitting, monitor your email and the application portal for updates. Some scholarships require an interview or additional documents after the initial submission.</li>' +
    '</ol>' +
    (s.infoLink && s.infoLink !== s.applyLink ? '<p style="margin-top:var(--space-4);"><a href="' + esc(s.infoLink) + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Read full eligibility and instructions on official site ↗</a></p>' : '') +
  '</div>';

  /* ---- Dynamic FAQ generation ---------------------------------------- */
  var faqItems = [];

  faqItems.push({
    q: 'What English test scores does this scholarship require?',
    a: engItems.length > 0
      ? '<p>' + engItems.map(function (i) { return esc(i); }).join(' ') + '</p><p>Many universities also accept PTE Academic, Duolingo English Test, or Cambridge English qualifications as alternatives to IELTS and TOEFL. Check the official website for the full list of accepted tests and minimum scores.</p>'
      : '<p>This scholarship requires proof of English proficiency. Typical requirements are IELTS 6.0–7.0, TOEFL iBT 80–100, PTE 58–76, or Duolingo 105–120, but exact scores vary by programme. Some scholarships waive the English test requirement if your previous degree was taught in English. Check the eligibility section above and the official website for specific requirements.</p>'
  });

  faqItems.push({
    q: 'What GPA or academic score do I need?',
    a: gpaItems.length > 0
      ? '<p>' + gpaItems.map(function (i) { return esc(i); }).join(' ') + '</p><p>For reference, a CGPA of 3.0/4.0 (or 60–70% depending on your grading system) is generally the minimum for competitive international scholarships. Top scholarships like Chevening, Rhodes, and Gates Cambridge typically require a first-class or strong upper-second-class equivalent.</p>'
      : '<p>Competitive scholarships typically expect a CGPA of 3.0/4.0 or higher (or equivalent percentage depending on your country\'s grading system). For reference, 60–70% in the Indian or Pakistani grading system is roughly equivalent to a 3.0/4.0 CGPA. Top-tier scholarships like Chevening, Rhodes, and Gates Cambridge typically require a first-class or strong upper-second-class (2:1) equivalent. Check the eligibility section above for this scholarship\'s specific requirements.</p>'
  });

  faqItems.push({
    q: 'Can I apply if I\'m still in my final year?',
    a: '<p>Yes — most international scholarships accept applications from final-year students. You can apply with your current transcripts and submit the final degree certificate before the programme starts. Many universities issue conditional offers pending degree completion. If you are in your final year, mention your expected graduation date in your application and provide updated transcripts once available.</p>'
  });

  faqItems.push({
    q: 'How competitive is this scholarship?',
    a: '<p>This scholarship has a <strong>' + esc(s.competition || 'competitive') + '</strong> selection rate. ' +
      (s.competition === 'Very High'
        ? 'Acceptance rates for very high competition scholarships can be below 1%. Thousands of qualified applicants apply each year. To stand out, focus on a clear narrative about your career goals, demonstrate leadership and impact in your community, and show how studying abroad will help you contribute to your home country\'s development.'
        : s.competition === 'High'
        ? 'High competition means many qualified applicants compete for limited spots. Strengthen your application by tailoring your motivation letter to this specific programme, getting strong recommendation letters from academic or professional references, and demonstrating clear career goals tied to your field of study.'
        : 'Moderate competition means you have a realistic chance if you prepare a strong application. Focus on presenting a clear motivation letter, strong academic record, and well-prepared documents.') +
      '</p>'
  });

  faqItems.push({
    q: 'Can I study abroad without IELTS?',
    a: (engItems.length > 0 && /ielts/i.test(engItems.join(' ')) === false)
      ? '<p>This particular scholarship accepts alternative English proficiency proofs — check the eligibility section above for details. Many scholarships and universities worldwide accept PTE Academic, Duolingo English Test, TOEFL iBT, or Cambridge English in place of IELTS. Some also waive the English test entirely if your previous degree was taught in English. Read our <a href="study-abroad-without-ielts">complete guide to studying abroad without IELTS</a> for more options.</p>'
      : '<p>Yes, it is possible to study abroad without IELTS in many countries and programmes. Alternatives include TOEFL iBT, PTE Academic, Duolingo English Test, and Cambridge English qualifications. Some universities waive the English test requirement if your previous degree was taught in English. Several fully funded scholarships also accept applicants without IELTS — read our <a href="study-abroad-without-ielts">complete guide to studying abroad without IELTS</a> for details.</p>'
  });

  faqItems.push({
    q: 'What documents do I need to prepare in advance?',
    a: '<p>Essential documents for most international scholarships include: ' +
      (s.documentsRequired && s.documentsRequired.length > 0
        ? s.documentsRequired.slice(0, 5).map(function (d) { return esc(d); }).join(', ').replace(/, ([^,]*)$/, ', and $1')
        : 'academic transcripts, degree certificates, a valid passport, English proficiency test scores, a CV/resume, two to three recommendation letters, and a statement of purpose or motivation letter') +
      '. Some countries require additional steps — for example, degree attestation from your university\'s issuing authority, HEC verification (Pakistan), or APS certification (Germany for certain nationalities). Start collecting documents at least 2–3 months before the deadline.</p>'
  });

  faqItems.push({
    q: 'Do I need a supervisor before applying?',
    a: isPhD
      ? '<p>Yes — for PhD and doctoral scholarships, having a confirmed supervisor who agrees to supervise your research is usually required or strongly recommended. Many scholarships like the Australian RTP, DAAD, Swiss Excellence, and CAS-TWAS President\'s Fellowship require a supervisor endorsement letter. Start contacting potential supervisors 4–6 months before the deadline. Read our guide on <a href="how-to-get-strong-letters-of-recommendation">getting strong recommendation letters</a> for tips on approaching professors.</p>'
      : '<p>For Masters and undergraduate scholarships, a supervisor is generally not required before applying. However, if the programme involves research or a thesis component, contacting a potential supervisor in advance can strengthen your application. For PhD-level scholarships, a confirmed supervisor is usually mandatory — start reaching out to potential supervisors 4–6 months before the deadline.</p>'
  });

  faqItems.push({
    q: 'How do I apply for this scholarship from my country?',
    a: '<p>You can apply directly through the scholarship\'s official application portal linked above. Most international scholarships are open to applicants worldwide — simply follow the instructions on the official website and submit your application online. Some government-funded scholarships (such as Chevening, Fulbright, Commonwealth, and Australia Awards) have country-specific application processes managed through British Council, USIEF, or similar bodies in your country. Always verify the specific application channel for your nationality on the official scholarship website.</p>'
  });

  var faqHtml = '<div class="info-section card">' +
    '<h2>❓ Frequently asked questions</h2>' +
    '<div class="faq-list">' +
    faqItems.map(function (item) {
      return '<div class="faq-item"><button class="faq-q">' + esc(item.q) + ' <span class="faq-toggle">+</span></button><div class="faq-a">' + item.a + '</div></div>';
    }).join('') +
    '</div></div>';

  /* ---- Related scholarships (same country or region) ------------------ */
  var related = SB.all.filter(function (o) {
    return o.id !== s.id && (o.country === s.country || o.region === s.region);
  }).slice(0, 4);
  var relatedHtml = related.length > 0
    ? '<div class="info-section card">' +
      '<h2>🔗 Related scholarships</h2>' +
      '<div class="related-grid">' +
      related.map(function (r) {
        var rd = SB.deadlineInfo(r);
        return '<a href="scholarship?id=' + encodeURIComponent(r.id) + '" class="related-card card">' +
          '<div class="flex gap-3 items-center">' + SB.flagImg(r.country, 24) +
          '<div><strong>' + esc(r.name) + '</strong><br><span class="muted">' + esc(r.provider) + '</span></div></div>' +
          '<div class="flex gap-2 mt-4" style="flex-wrap:wrap;">' +
            '<span class="pill">' + esc(r.fundingType) + '</span>' +
            '<span class="pill pill-blue">' + esc((r.levels || []).join(', ')) + '</span>' +
          '</div>' +
          '<p class="muted" style="margin-top:var(--space-2);font-size:var(--text-sm);">' + esc(SB.short(r.fundingSummary, 100)) + '</p>' +
        '</a>';
      }).join('') +
      '</div></div>'
    : '';

  var html = '' +
  '<header class="sc-hero section pb-0">' +
    '<div class="container">' +
      '<a href="scholarships" class="hero-back">← All scholarships</a>' +
      '<div class="sc-hero-card card animate-fade-in-up">' +
        '<div class="sc-hero-top flex justify-between items-start">' +
          '<div class="flex gap-4 items-center">' +
            '<div class="sc-hero-flag">' + SB.flagImg(s.country, 48) + '</div>' +
            '<div>' +
              '<h1>' + esc(s.name) + '</h1>' +
              '<p class="sc-org">' + esc(s.provider) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="flex flex-col items-end gap-2">' +
            '<span class="status-badge ' + sm.cls + '">' + sm.text + '</span>' +
            '<button class="btn btn-outline btn-sm" id="save-btn">' + (window.Saved && window.Saved.has(s.id) ? '❤️ Saved' : '🤍 Save') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="sc-quick-stats grid grid-4 mt-8">' +
          '<div class="stat-box"><span class="stat-label">Funding</span><span class="stat-val">' + esc(s.fundingType) + '</span></div>' +
          '<div class="stat-box"><span class="stat-label">Level</span><span class="stat-val">' + esc((s.levels || []).join(', ')) + '</span></div>' +
          '<div class="stat-box"><span class="stat-label">Deadline</span>' + deadlineStat + '</div>' +
          '<div class="stat-box"><span class="stat-label">Apply fee</span>' + feeStat + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</header>' +

  '<section class="container section">' +
    '<div class="layout-grid">' +

      '<div class="detail-main">' +
        daysBanner +

        '<div class="info-section card">' +
          '<h2>Overview</h2>' +
          '<p class="lead">' + esc(s.fundingSummary) + '</p>' +
          '<div class="fact-grid">' +
            factRow('Host', s.hostUniversities) +
            factRow('Country / region', s.country + ' · ' + s.region) +
            factRow('Intake', s.intake) +
            factRow('Duration', s.durationNote) +
            factRow('Competition', s.competition) +
            factRow('Deadline note', s.deadlineNote) +
          '</div>' +
          '<div class="chips-row">' + levelChips + fieldsChips + '</div>' +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>✅ Eligibility criteria</h2>' +
          list(s.eligibility) +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>📄 Documents required</h2>' +
          list(s.documentsRequired) +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>🎁 Benefits &amp; perks</h2>' +
          list(s.benefits, 'perk-list') +
        '</div>' +

        '<div class="info-section card before-card">' +
          '<h2>🎒 Before you apply</h2>' +
          '<p class="muted">Tick these off — have them ready before you start the application.</p>' +
          '<ul class="checklist ready-list">' + beforeHtml + '</ul>' +
          '<div class="ready-progress"><div class="ready-progress-fill" id="ready-fill" style="width:0%"></div></div>' +
          '<span class="ready-label" id="ready-label">0 of ' + beforeItems.length + ' ready</span>' +
        '</div>' +

        howToApplyHtml +

        faqHtml +
        relatedHtml +
      '</div>' +

      '<div class="detail-side">' +
        '<div class="apply-box card sticky">' +
          '<div class="apply-fee ' + (s.isFree ? 'free' : 'paid') + '">' +
            (s.isFree ? '✓ Free to apply' : '💳 Application fee: ' + esc(s.applicationFee)) +
          '</div>' +
          '<a href="' + esc(s.applyLink) + '" target="_blank" rel="noopener" class="btn btn-primary btn-lg w-full apply-cta">Apply on official site ↗</a>' +
          '<a href="' + esc(s.infoLink || s.applyLink) + '" target="_blank" rel="noopener" class="btn btn-outline w-full" style="margin-top:10px;">Eligibility &amp; full info ↗</a>' +
          '<div class="apply-meta">' +
            '<div class="apply-meta-row"><span>Status</span><span class="status-badge ' + sm.cls + '">' + sm.text + '</span></div>' +
            '<div class="apply-meta-row"><span>Deadline</span><span>' + (d.hasDate ? esc(SB.monthNames[s.deadlineMonthNum - 1]) + ' (approx.)' : 'Varies') + '</span></div>' +
            '<div class="apply-meta-row"><span>Funding</span><span>' + esc(s.fundingType) + '</span></div>' +
          '</div>' +
          '<button class="btn btn-ghost w-full share-btn" id="share-btn" style="margin-top:8px;">🔗 Copy share link</button>' +
          '<p class="apply-disclaimer">Deadlines shown are typical annual windows. Confirm the exact date on the official site.</p>' +
        '</div>' +
      '</div>' +

    '</div>' +
  '</section>';

  var app = document.getElementById('app');
  app.innerHTML = html;

  // ---- Before-you-apply progress ----
  var readyBoxes = app.querySelectorAll('input[data-ready]');
  function updateReady() {
    var total = readyBoxes.length;
    var done = 0;
    readyBoxes.forEach(function (cb) {
      if (cb.checked) { done++; cb.parentElement.querySelector('span').style.textDecoration = 'line-through'; cb.parentElement.querySelector('span').style.color = '#94a3b8'; }
      else { cb.parentElement.querySelector('span').style.textDecoration = 'none'; cb.parentElement.querySelector('span').style.color = ''; }
    });
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('ready-fill').style.width = pct + '%';
    document.getElementById('ready-label').textContent = done + ' of ' + total + ' ready';
  }
  readyBoxes.forEach(function (cb) { cb.addEventListener('change', updateReady); });

  // ---- Save (visual only) ----
  var saveBtn = document.getElementById('save-btn');
  saveBtn.addEventListener('click', function () {
    if (window.Saved) {
      var nowSaved = window.Saved.toggle(s.id);
      saveBtn.textContent = nowSaved ? '❤️ Saved' : '🤍 Save';
      saveBtn.classList.toggle('btn-primary', nowSaved);
    } else {
      var on = saveBtn.textContent.indexOf('❤️') !== -1;
      saveBtn.textContent = on ? '🤍 Save' : '❤️ Saved';
    }
  });

  // ---- Share link ----
  var shareBtn = document.getElementById('share-btn');
  shareBtn.addEventListener('click', function () {
    var url = location.href;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        shareBtn.textContent = '✓ Link copied!';
        setTimeout(function () { shareBtn.textContent = '🔗 Copy share link'; }, 2000);
      });
    }
  });

  // ---- FAQ accordion ----
  app.querySelectorAll('.faq-q').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.parentElement;
      var isActive = item.classList.contains('active');
      item.classList.toggle('active');
      btn.querySelector('.faq-toggle').textContent = isActive ? '+' : '−';
    });
  });

  // ---- Dynamic meta tags for this specific scholarship ----
  document.title = s.name + ' — Eligibility, Documents, Deadlines, Tips | AbroadReady';
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = 'Full details for ' + esc(s.name) + ': eligibility criteria, documents required, benefits, application deadline, and tips on how to apply for this ' + esc(s.fundingType.toLowerCase()) + ' scholarship.';
  var ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.content = esc(s.name) + ' | AbroadReady';
  var twitterTitle = document.querySelector('meta[name="twitter:title"]');
  if (twitterTitle) twitterTitle.content = esc(s.name) + ' | AbroadReady';

  // ---- Dynamic FAQ + Scholarship schema ----
  var schemaScript = document.createElement('script');
  schemaScript.type = 'application/ld+json';
  schemaScript.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Scholarship",
    "name": s.name,
    "description": s.fundingSummary || s.name + ' scholarship for international students',
    "provider": { "@type": "Organization", "name": s.provider },
    "funder": { "@type": "Organization", "name": s.provider },
    "offers": {
      "@type": "Offer",
      "category": s.fundingType === "Fully Funded" ? "Full Scholarship" : "Partial Scholarship",
      "description": s.fundingSummary
    },
    "eligibleRegion": { "@type": "Place", "name": "International" },
    "funding": s.fundingType,
    "url": "https://abroadready.org/pages/scholarship?id=" + encodeURIComponent(s.id)
  });
  document.head.appendChild(schemaScript);

  // ---- FAQ structured data (for AI crawlers and Bing) ----
  var faqSchema = document.createElement('script');
  faqSchema.type = 'application/ld+json';
  faqSchema.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": faqItems.map(function (item) {
      return {
        "@type": "Question",
        "name": item.q,
        "acceptedAnswer": {
          "@type": "Answer",
          "text": item.a.replace(/<[^>]+>/g, '')
        }
      };
    })
  });
  document.head.appendChild(faqSchema);
});
</script>
<script src="../js/components.js"></script>
</body>
</html>
