<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | AbroadReady</title>
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           background:#f8fafc; color:#0f172a; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .nf { text-align:center; padding:24px; max-width:480px; }
    .nf h1 { font-size:3rem; margin:0 0 8px; color:#2563eb; }
    .nf p { font-size:1.05rem; color:#475569; line-height:1.6; }
    .nf a { color:#2563eb; text-decoration:none; font-weight:600; }
  </style>
  <script>
    (function () {
      var p = location.pathname.replace(/\/+$/, '');
      if (!p || p === '/index' || p.indexOf('.') !== -1) return;
      fetch(p + '.html').then(function (r) {
        if (!r.ok) return;
        r.text().then(function (html) {
          document.open();
          document.write(html);
          document.close();
        });
      });
    })();
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  </script>
</head>
<body>
  <div class="nf">
    <h1>404</h1>
    <p>We couldn't find that page. It may have moved. Try the <a href="/">homepage</a> or <a href="/pages/scholarships">browse scholarships</a>.</p>
  </div>
</body>
</html>
