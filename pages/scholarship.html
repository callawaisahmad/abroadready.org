<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MDWR309ZKM"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Details — Eligibility, Documents, Deadlines | AbroadReady</title>
  <meta name="description" content="Full scholarship details including eligibility criteria, required documents, benefits, application deadlines, and tips. Browse fully funded international scholarships.">
  <meta name="keywords" content="scholarship details, international scholarships, fully funded scholarships, scholarship eligibility, scholarship application tips, study abroad funding, scholarships for Pakistani students">
  <link rel="canonical" href="https://abroadready.org/pages/scholarship">
  <meta property="og:title" content="Scholarship Details | AbroadReady">
  <meta property="og:description" content="Full scholarship details: eligibility, documents, benefits, deadlines, and application tips. Find your path abroad.">
  <meta property="og:url" content="https://abroadready.org/pages/scholarship">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AbroadReady">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Scholarship Details | AbroadReady">
  <meta name="twitter:description" content="Full scholarship details including eligibility, documents, benefits, deadlines, and application tips.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Scholarship Details",
    "description": "Full scholarship details including eligibility criteria, required documents, benefits, deadlines, and application tips for international students.",
    "publisher": { "@type": "Organization", "name": "AbroadReady", "url": "https://abroadready.org" },
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://abroadready.org/" },
        { "@type": "ListItem", "position": 2, "name": "Scholarships", "item": "https://abroadready.org/pages/results" },
        { "@type": "ListItem", "position": 3, "name": "Scholarship Details", "item": "https://abroadready.org/pages/scholarship" }
      ]
    }
  }
  </script>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/scholarship.css">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#3b82f6">
</head>
<body>
<script src="../js/saved.js"></script>

<!-- Navbar -->
<nav class="navbar glass-panel">
  <div class="container flex items-center justify-between">
    <a href="../" class="nav-logo">
      <span class="logo-icon">🎓</span>
      <span class="logo-text">Abroad<span class="text-gradient">Ready</span></span>
    </a>
    <div class="nav-actions flex items-center gap-4">
      <a href="results" class="btn btn-ghost btn-sm">← Back to all scholarships</a>
    </div>
  </div>
</nav>

<!-- Content is rendered here by JS based on ?id= -->
<div id="app"></div>

<!-- Not-found fallback -->
<div id="notfound" class="container section" style="display:none; text-align:center;">
  <div style="font-size:3.5rem;">🧭</div>
  <h1>Scholarship not found</h1>
  <p class="sc-org" style="margin:var(--space-4) 0 var(--space-8);">We couldn't find that scholarship. It may have been renamed or removed.</p>
  <a href="results" class="btn btn-primary">Scholarships</a>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border:none;">
      <p>© 2026 AbroadReady.org — Always confirm details on the official scholarship website before applying.</p>
    </div>
  </div>
</footer>

<script src="../js/scholarships-data.js"></script>
<script src="../js/scholarships.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var SB = window.SB;
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var s = id ? SB.byId(id) : (SB.all[0] || null);

  if (!s) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  document.title = s.name + ' | AbroadReady';

  var d = SB.deadlineInfo(s);
  var sm = SB.statusMeta(d.status);
  var esc = SB.esc;

  function list(items, cls) {
    if (!items || !items.length) return '<p class="muted">Details vary — see the official website.</p>';
    return '<ul class="' + (cls || 'req-list') + '">' + items.map(function (i) {
      return '<li>' + esc(i) + '</li>';
    }).join('') + '</ul>';
  }

  function factRow(label, value) {
    if (!value) return '';
    return '<div class="fact-row"><span class="fact-label">' + esc(label) + '</span><span class="fact-value">' + esc(value) + '</span></div>';
  }

  var deadlineStat = d.status === 'closed' || d.status === 'upcoming'
    ? '<span class="stat-val" style="color:#6b7280;">' + esc(d.label) + '</span>'
    : d.hasDate
      ? '<span class="stat-val ' + (d.status === 'closing' ? 'text-red' : '') + '">' + esc(d.label) + '</span>'
      : '<span class="stat-val">' + esc(s.deadlineNote || 'Varies') + '</span>';

  var feeStat = s.isFree
    ? '<span class="stat-val" style="color:#047857;">Free</span>'
    : '<span class="stat-val">' + esc(s.applicationFee) + '</span>';

  // Before-you-apply interactive checklist
  var beforeItems = (s.thingsToHaveBeforeApply && s.thingsToHaveBeforeApply.length)
    ? s.thingsToHaveBeforeApply
    : ['Academic transcripts', 'Valid passport', 'A strong CV / résumé'];
  var beforeHtml = beforeItems.map(function (i, idx) {
    return '<li><label><input type="checkbox" data-ready><span>' + esc(i) + '</span></label></li>';
  }).join('');

  var fieldsChips = (s.fields || []).map(function (f) {
    return '<span class="pill">' + esc(f) + '</span>';
  }).join('');
  var levelChips = (s.levels || []).map(function (l) {
    return '<span class="pill pill-blue">' + esc(l) + '</span>';
  }).join('');

  var daysBanner = d.status === 'closed' && d.opens && d.closes
    ? '<div class="deadline-banner" style="background:rgba(107,114,128,0.1);border-color:#d1d5db;">🔒 Closed · Next window: ' + esc(SB.monthNames[d.opens.getMonth()]) + ' → ' + esc(SB.monthNames[d.closes.getMonth()]) + ' ' + d.closes.getFullYear() + '</div>'
    : d.status === 'closed'
    ? '<div class="deadline-banner" style="background:rgba(107,114,128,0.1);border-color:#d1d5db;">🔒 Applications are currently closed. ' + esc(d.label || '') + '</div>'
    : d.status === 'upcoming'
      ? '<div class="deadline-banner" style="background:rgba(245,158,11,0.1);border-color:#f59e0b;">📅 Applications open ' + esc((d.opens ? SB.monthNames[d.opens.getMonth()] + ' ' + d.opens.getFullYear() : d.label || '')) + '</div>'
      : d.hasDate
        ? d.opens && d.closes
          ? '<div class="deadline-banner ' + (d.status === 'closing' ? 'urgent' : '') + '">📅 <strong>' + esc(SB.monthNames[d.opens.getMonth()]) + ' → ' + esc(SB.monthNames[d.closes.getMonth()]) + ' ' + d.closes.getFullYear() + '</strong> · ⏳ ' + d.daysLeft + ' days left</div>'
          : '<div class="deadline-banner ' + (d.status === 'closing' ? 'urgent' : '') + '">⏳ <strong>' + d.daysLeft + ' days</strong> until the approximate ' + esc(SB.monthNames[s.deadlineMonthNum - 1]) + ' deadline</div>'
        : '<div class="deadline-banner rolling">🔄 Rolling / varies — confirm exact dates on the official site</div>';

  var html = '' +
  '<header class="sc-hero section pb-0">' +
    '<div class="container">' +
      '<a href="results" class="hero-back">← All scholarships</a>' +
      '<div class="sc-hero-card card animate-fade-in-up">' +
        '<div class="sc-hero-top flex justify-between items-start">' +
          '<div class="flex gap-4 items-center">' +
            '<div class="sc-hero-flag">' + SB.flagImg(s.country, 48) + '</div>' +
            '<div>' +
              '<h1>' + esc(s.name) + '</h1>' +
              '<p class="sc-org">' + esc(s.provider) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="flex flex-col items-end gap-2">' +
            '<span class="status-badge ' + sm.cls + '">' + sm.text + '</span>' +
            '<button class="btn btn-outline btn-sm" id="save-btn">' + (window.Saved && window.Saved.has(s.id) ? '❤️ Saved' : '🤍 Save') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="sc-quick-stats grid grid-4 mt-8">' +
          '<div class="stat-box"><span class="stat-label">Funding</span><span class="stat-val">' + esc(s.fundingType) + '</span></div>' +
          '<div class="stat-box"><span class="stat-label">Level</span><span class="stat-val">' + esc((s.levels || []).join(', ')) + '</span></div>' +
          '<div class="stat-box"><span class="stat-label">Deadline</span>' + deadlineStat + '</div>' +
          '<div class="stat-box"><span class="stat-label">Apply fee</span>' + feeStat + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</header>' +

  '<section class="container section">' +
    '<div class="layout-grid">' +

      '<div class="detail-main">' +
        daysBanner +

        '<div class="info-section card">' +
          '<h2>Overview</h2>' +
          '<p class="lead">' + esc(s.fundingSummary) + '</p>' +
          '<div class="fact-grid">' +
            factRow('Host', s.hostUniversities) +
            factRow('Country / region', s.country + ' · ' + s.region) +
            factRow('Intake', s.intake) +
            factRow('Duration', s.durationNote) +
            factRow('Competition', s.competition) +
            factRow('Deadline note', s.deadlineNote) +
          '</div>' +
          '<div class="chips-row">' + levelChips + fieldsChips + '</div>' +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>✅ Eligibility criteria</h2>' +
          list(s.eligibility) +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>📄 Documents required</h2>' +
          list(s.documentsRequired) +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>🎁 Benefits &amp; perks</h2>' +
          list(s.benefits, 'perk-list') +
        '</div>' +

        '<div class="info-section card before-card">' +
          '<h2>🎒 Before you apply</h2>' +
          '<p class="muted">Tick these off — have them ready before you start the application.</p>' +
          '<ul class="checklist ready-list">' + beforeHtml + '</ul>' +
          '<div class="ready-progress"><div class="ready-progress-fill" id="ready-fill" style="width:0%"></div></div>' +
          '<span class="ready-label" id="ready-label">0 of ' + beforeItems.length + ' ready</span>' +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>💡 Application tips</h2>' +
          '<ul class="req-list tip-list">' +
            '<li>📌 <strong>Start early:</strong> Begin gathering documents at least 2-3 months before the deadline to avoid last-minute issues.</li>' +
            '<li>📌 <strong>Read eligibility carefully:</strong> Every year, hundreds of applicants are rejected for not meeting basic criteria. Double-check every requirement.</li>' +
            '<li>📌 <strong>Tailor your application:</strong> Generic essays and statements are easy to spot. Customise each application to the specific scholarship programme.</li>' +
            '<li>📌 <strong>Get feedback on your essays:</strong> Ask a teacher, mentor, or friend to review your statement of purpose and motivation letter before submitting.</li>' +
            '<li>📌 <strong>Prepare for interviews:</strong> Many scholarships have an interview stage. Practice common scholarship interview questions with a friend.</li>' +
            '<li>📌 <strong>Apply to multiple scholarships:</strong> Don\'t put all your eggs in one basket. Apply to 3-5 scholarships to increase your chances of winning funding.</li>' +
          '</ul>' +
        '</div>' +

        '<div class="info-section card">' +
          '<h2>❓ Frequently asked questions</h2>' +
          '<div class="faq-list">' +
            '<div class="faq-item"><button class="faq-q">Can I apply if I haven\'t taken an English test yet? <span class="faq-toggle">+</span></button><div class="faq-a"><p>Most scholarships accept applications with pending English test scores, but you must submit them before the final deadline. Some scholarships like Chevening and Fulbright require scores by the application deadline. Check the specific requirements on the official website.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">What GPA do I need for this scholarship? <span class="faq-toggle">+</span></button><div class="faq-a"><p>Competitive scholarships typically expect a CGPA of 3.0/4.0 or higher (or equivalent). For top scholarships like Chevening, Rhodes, and Gates Cambridge, you need a strong upper-second-class degree (2:1) or first-class equivalent. Check the eligibility section above for specific requirements.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">Can I apply if I\'m still in my final year? <span class="faq-toggle">+</span></button><div class="faq-a"><p>Yes — most scholarships accept applications from final-year students who will complete their degree before the programme start date. You can apply with your current transcripts and submit the final certificate later. Many universities issue conditional offers pending degree completion.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">How competitive is this scholarship? <span class="faq-toggle">+</span></button><div class="faq-a"><p>This scholarship has a <strong>' + esc(s.competition || 'competitive') + '</strong> selection rate. For very high competition scholarships like Chevening and Rhodes, acceptance rates can be below 1%. Focus on crafting a standout application with a clear narrative about your goals, leadership, and how you will contribute to your home country after your studies.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">How do I apply for this scholarship from my country? <span class="faq-toggle">+</span></button><div class="faq-a"><p>Students apply directly through the scholarship\'s official application portal or the relevant government channel in their country. Some scholarships (like Chevening, Commonwealth, and Fulbright) have country-specific application processes. Always verify the official instructions for your country on the scholarship website.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">What documents do I need to prepare in advance? <span class="faq-toggle">+</span></button><div class="faq-a"><p>Essential documents include: academic transcripts (attested by the relevant education authority in your country), degree certificates, valid passport, English proficiency test scores (IELTS or TOEFL), CV/resume, two to three recommendation letters, and a strong statement of purpose or motivation letter. Start collecting these at least 2-3 months before the deadline.</p></div></div>' +
            '<div class="faq-item"><button class="faq-q">Do I need a supervisor before applying? <span class="faq-toggle">+</span></button><div class="faq-a"><p>For PhD and research-based scholarships, having a confirmed supervisor who agrees to supervise your research significantly strengthens your application. Many scholarships like the Australian RTP, DAAD, and Swiss Excellence require a supervisor support letter. Start contacting potential supervisors 4-6 months before the deadline.</p></div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="detail-side">' +
        '<div class="apply-box card sticky">' +
          '<div class="apply-fee ' + (s.isFree ? 'free' : 'paid') + '">' +
            (s.isFree ? '✓ Free to apply' : '💳 Application fee: ' + esc(s.applicationFee)) +
          '</div>' +
          '<a href="' + esc(s.applyLink) + '" target="_blank" rel="noopener" class="btn btn-primary btn-lg w-full apply-cta">Apply on official site ↗</a>' +
          '<a href="' + esc(s.infoLink || s.applyLink) + '" target="_blank" rel="noopener" class="btn btn-outline w-full" style="margin-top:10px;">Eligibility &amp; full info ↗</a>' +
          '<div class="apply-meta">' +
            '<div class="apply-meta-row"><span>Status</span><span class="status-badge ' + sm.cls + '">' + sm.text + '</span></div>' +
            '<div class="apply-meta-row"><span>Deadline</span><span>' + (d.hasDate ? esc(SB.monthNames[s.deadlineMonthNum - 1]) + ' (approx.)' : 'Varies') + '</span></div>' +
            '<div class="apply-meta-row"><span>Funding</span><span>' + esc(s.fundingType) + '</span></div>' +
          '</div>' +
          '<button class="btn btn-ghost w-full share-btn" id="share-btn" style="margin-top:8px;">🔗 Copy share link</button>' +
          '<p class="apply-disclaimer">Deadlines shown are typical annual windows. Confirm the exact date on the official site.</p>' +
        '</div>' +
      '</div>' +

    '</div>' +
  '</section>';

  var app = document.getElementById('app');
  app.innerHTML = html;

  // ---- Before-you-apply progress ----
  var readyBoxes = app.querySelectorAll('input[data-ready]');
  function updateReady() {
    var total = readyBoxes.length;
    var done = 0;
    readyBoxes.forEach(function (cb) {
      if (cb.checked) { done++; cb.parentElement.querySelector('span').style.textDecoration = 'line-through'; cb.parentElement.querySelector('span').style.color = '#94a3b8'; }
      else { cb.parentElement.querySelector('span').style.textDecoration = 'none'; cb.parentElement.querySelector('span').style.color = ''; }
    });
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('ready-fill').style.width = pct + '%';
    document.getElementById('ready-label').textContent = done + ' of ' + total + ' ready';
  }
  readyBoxes.forEach(function (cb) { cb.addEventListener('change', updateReady); });

  // ---- Save (visual only) ----
  var saveBtn = document.getElementById('save-btn');
  saveBtn.addEventListener('click', function () {
    if (window.Saved) {
      var nowSaved = window.Saved.toggle(s.id);
      saveBtn.textContent = nowSaved ? '❤️ Saved' : '🤍 Save';
      saveBtn.classList.toggle('btn-primary', nowSaved);
    } else {
      var on = saveBtn.textContent.indexOf('❤️') !== -1;
      saveBtn.textContent = on ? '🤍 Save' : '❤️ Saved';
    }
  });

  // ---- Share link ----
  var shareBtn = document.getElementById('share-btn');
  shareBtn.addEventListener('click', function () {
    var url = location.href;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        shareBtn.textContent = '✓ Link copied!';
        setTimeout(function () { shareBtn.textContent = '🔗 Copy share link'; }, 2000);
      });
    }
  });

  // ---- FAQ accordion ----
  app.querySelectorAll('.faq-q').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.parentElement;
      var isActive = item.classList.contains('active');
      item.classList.toggle('active');
      btn.querySelector('.faq-toggle').textContent = isActive ? '+' : '−';
    });
  });

  // ---- Dynamic meta tags for this specific scholarship ----
  document.title = s.name + ' — Eligibility, Documents, Deadlines, Tips | AbroadReady';
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = 'Full details for ' + esc(s.name) + ': eligibility criteria, documents required, benefits, application deadline, and tips on how to apply for this ' + esc(s.fundingType.toLowerCase()) + ' scholarship.';
  var ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.content = esc(s.name) + ' | AbroadReady';
  var twitterTitle = document.querySelector('meta[name="twitter:title"]');
  if (twitterTitle) twitterTitle.content = esc(s.name) + ' | AbroadReady';

  // ---- Dynamic FAQ + Scholarship schema ----
  var schemaScript = document.createElement('script');
  schemaScript.type = 'application/ld+json';
  schemaScript.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Scholarship",
    "name": s.name,
    "description": s.fundingSummary || s.name + ' scholarship for international students',
    "provider": { "@type": "Organization", "name": s.provider },
    "funder": { "@type": "Organization", "name": s.provider },
    "offers": {
      "@type": "Offer",
      "category": s.fundingType === "Fully Funded" ? "Full Scholarship" : "Partial Scholarship",
      "description": s.fundingSummary
    },
    "eligibleRegion": { "@type": "Place", "name": "International" },
    "funding": s.fundingType,
    "url": "https://abroadready.org/pages/scholarship?id=" + encodeURIComponent(s.id)
  });
  document.head.appendChild(schemaScript);
});
</script>
<script src="../js/components.js"></script>
</body>
</html>
