<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AbroadReady">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.22" cy="0.3" r="0.6">
      <stop offset="0" stop-color="rgba(59,130,246,0.35)"/>
      <stop offset="1" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.78" cy="0.72" r="0.55">
      <stop offset="0" stop-color="rgba(139,92,246,0.3)"/>
      <stop offset="1" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
    <linearGradient id="arCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arSwoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="readyText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>

  <!-- Centered mark -->
  <g transform="translate(520 90) scale(2.4)">
    <path d="M60 18 L96 46 L60 74 L24 46 Z" fill="url(#arCap)"/>
    <path d="M50 68 L70 68 L65 86 Q60 90 55 86 Z" fill="#2563eb"/>
    <path d="M74 34 Q95 30 99 12" fill="none" stroke="url(#arSwoosh)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="99" cy="12" r="5" fill="#f59e0b"/>
  </g>

  <text x="600" y="380" text-anchor="middle" font-family="'Outfit','Segoe UI',Arial,sans-serif" font-size="92" font-weight="800" fill="#ffffff">Abroad<tspan fill="url(#readyText)">Ready</tspan></text>
  <text x="600" y="450" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="500" fill="#94a3b8">Find fully funded scholarships. Study anywhere in the world.</text>

  <rect x="470" y="505" rx="10" ry="10" width="260" height="54" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="600" y="540" text-anchor="middle" font-family="'Outfit','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#60a5fa">abroadready.org · Free for all</text>
</svg>
